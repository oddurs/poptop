name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Both targets, always. src/collect/linux.rs is cfg'd out of a macOS build
  # entirely, so a macOS-only run neither compiles nor tests the /proc backend
  # — a syntax error in it has already passed a clean local build once.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the commit messages this push introduces can be
          # scanned rather than just the tip.
          fetch-depth: 0
      # The layer that cannot be skipped. The hook is opt-in per clone and
      # `./check` is opt-in per person; this is neither.
      - name: no tool attribution
        run: |
          git ls-files -z | grep -zv '^\.githooks/' | xargs -0 .githooks/no-attribution
          base='${{ github.event.pull_request.base.sha }}'
          [ -n "$base" ] || base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          git log --format='%B%n%an%n%cn' "$base..HEAD" | .githooks/no-attribution --stdin
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      # Intel Macs, under Rosetta on the arm64 runner. The two macOS ABIs
      # differ where poptop declares FFI by hand: on x86_64 the bare
      # `getfsstat` symbol is the pre-10.6 call with a different
      # `struct statfs`, and only this run links it.
      - name: test the x86_64 macOS build
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo test --target x86_64-apple-darwin
      # Reported, not enforced: a shared runner's timing is noise. `./check
      # --perf` is where a budget fails. See src/budget.rs.
      - name: performance budgets, reported
        env:
          POPTOP_BUDGET: report
        run: "cargo test --release --bin poptop budget:: -- --ignored --test-threads=1 --nocapture"
      - name: smoke test the collector against live data
        run: cargo run --release -- --once
      # Piped into a reader that stops early. Rust ignores SIGPIPE and turns
      # the write error into a panic, so this is the regression test for
      # `poptop --once | head` taking the tool down.
      - name: plain-text output survives a closed pipe
        run: |
          set -o pipefail
          cargo run --release -- --once | head -1
          cargo run --release -- --help | head -1

  # The oldest toolchain `rust-version` claims to build on. A README that
  # states an MSRV nothing checks is a promise that expires the first time
  # somebody uses a newer standard-library method, and the person who finds
  # out is on the old compiler.
  #
  # Linux only: the macOS backend is a different dependency set, but the
  # floor is set by ratatui and time, which both builds share.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version from Cargo.toml
        id: msrv
        run: sed -n 's/^rust-version = "\(.*\)"$/msrv=\1/p' Cargo.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
      - uses: Swatinem/rust-cache@v2
      # `--all-targets`, not `test`: this asks whether the crate compiles on
      # the oldest supported compiler. Whether it behaves is the stable job's
      # question, and asking it twice buys nothing for the runtime.
      - run: cargo build --all-targets

  # The whole suite under AddressSanitizer. All of poptop's `unsafe` is calls
  # into libc declared by hand, which Miri cannot execute; ASan intercepts
  # those same calls and checks every buffer handed across. Linux only: on
  # macOS it stops at a read past a string literal inside sysinfo (0101).
  # Both platforms: the one report ASan has ever made here was in sysinfo,
  # which only the macOS backend links (0101).
  asan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: cargo test under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo test -Zbuild-std --target ${{ matrix.target }} --bin poptop

  # Every fuzz target for a minute, from the committed seeds, on Linux: the
  # only platform where the /proc, NFS and taskstats targets are compiled at
  # all. A minute finds regressions in what the seeds already reach; the long
  # runs that find new things are `./check --fuzz=3600`, by hand.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          cache-all-crates: true
      - run: cargo install cargo-fuzz --locked
      - name: every target, sixty seconds each
        working-directory: fuzz
        run: |
          for t in $(sed -n 's/^name = "\(.*\)"$/\1/p' Cargo.toml | grep -v '^poptop-fuzz$'); do
            mkdir -p corpus/$t
            cargo fuzz run $t corpus/$t seeds/$t -- -max_total_time=60 \
              -timeout=1 -rss_limit_mb=1024 -malloc_limit_mb=1024
          done
      - name: keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

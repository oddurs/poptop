name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Both targets, always. src/collect/linux.rs is cfg'd out of a macOS build
  # entirely, so a macOS-only run neither compiles nor tests the /proc backend
  # — a syntax error in it has already passed a clean local build once.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the commit messages this push introduces can be
          # scanned rather than just the tip.
          fetch-depth: 0
      # The layer that cannot be skipped. The hook is opt-in per clone and
      # `./check` is opt-in per person; this is neither.
      - name: no tool attribution
        run: |
          git ls-files -z | grep -zv '^\.githooks/' | xargs -0 .githooks/no-attribution
          base='${{ github.event.pull_request.base.sha }}'
          [ -n "$base" ] || base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          git log --format='%B%n%an%n%cn' "$base..HEAD" | .githooks/no-attribution --stdin
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: smoke test the collector against live data
        run: cargo run --release -- --once
      # Piped into a reader that stops early. Rust ignores SIGPIPE and turns
      # the write error into a panic, so this is the regression test for
      # `poptop --once | head` taking the tool down.
      - name: plain-text output survives a closed pipe
        run: |
          set -o pipefail
          cargo run --release -- --once | head -1
          cargo run --release -- --help | head -1

[package]
name = "poptop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A system monitor you can rewind"
readme = "README.md"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
# Text is measured in terminal columns, not scalar values. Already here through
# ratatui, which uses it for the same reason; declared directly because this
# crate calls it directly.
unicode-width = "0.2.2"

[features]
# Compiles the program's modules into the library as well, for `fuzz/`. Off in
# every normal build, where the library is empty; see src/lib.rs.
fuzzing = []

# Every `unsafe` block says why it is sound, in a `// SAFETY:` comment directly
# above it. All of them are calls across FFI declared by hand, which is exactly
# where a reason nobody wrote down goes stale unnoticed.
[lints.clippy]
undocumented_unsafe_blocks = "deny"
# A panic in a TUI is worse than an error. Outside tests (see clippy.toml), a
# value that cannot be absent says why in an `expect`, and one that can be is
# handled.
unwrap_used = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = "0.38.4"

[profile.release]
lto = true
codegen-units = 1
strip = true

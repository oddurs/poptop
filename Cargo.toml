[package]
name = "poptop"
version = "0.1.0"
edition = "2024"
# Not a guess: 1.85 is the floor for edition 2024, but ratatui, sysinfo and
# time all require 1.88, so that is what a build actually needs. `cargo +1.88
# test` passes; `cargo +1.85 check` fails in the dependency graph before it
# reaches this crate. CI holds it to this.
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "A system monitor you can rewind: scrub back through every sample it has taken, including the whole process table"
readme = "README.md"
repository = "https://github.com/oddurs/poptop"
homepage = "https://github.com/oddurs/poptop"
documentation = "https://github.com/oddurs/poptop/tree/master/docs"
keywords = ["monitoring", "tui", "process", "observability", "top"]
categories = ["command-line-utilities", "development-tools::profiling"]
# What a published crate needs, and nothing else. `docs/` stays: it is what
# `documentation` points at, it is 288K of markdown, and two unit tests read
# it with `include_str!`. `tests/` goes: 15M of it is a captured Linux
# `/proc` and `/sys` tree, which is how this repository tests a backend it
# cannot run on the developer's machine — a fact about the repository, not
# something a published crate should carry.
exclude = [
    "/cairn",
    "/cairn.toml",
    "/tests",
    "/validate",
    "/tools",
    "/fuzz",
    "/.githooks",
    "/.github",
    "/ROADMAP.md",
    "/RELEASING.md",
]

[dependencies]
# `use-dev-tty`: crossterm's other input source, which reads the terminal with
# poll(2) and stops at end-of-file. The default mio source reads it in a loop
# that never ends once the terminal has gone away — an ssh session dropping —
# so poptop was left orphaned at 100% of a core, its stop flag set and never
# looked at (0115).
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
ratatui = "0.30.2"
# Text is measured in terminal columns, not scalar values. Already here through
# ratatui, which uses it for the same reason; declared directly because this
# crate calls it directly.
unicode-width = "0.2.2"
# SIGTERM and SIGHUP as a flag the main loop reads, so either quits like `q`
# and gives the terminal back. Already here through crossterm, which uses it
# for SIGWINCH.
signal-hook = "0.4.4"

[features]
# Compiles the program's modules into the library as well, for `fuzz/`. Off in
# every normal build, where the library is empty; see src/lib.rs.
fuzzing = []

# Every `unsafe` block says why it is sound, in a `// SAFETY:` comment directly
# above it. All of them are calls across FFI declared by hand, which is exactly
# where a reason nobody wrote down goes stale unnoticed.
[lints.clippy]
undocumented_unsafe_blocks = "deny"
# A panic in a TUI is worse than an error. Outside tests (see clippy.toml), a
# value that cannot be absent says why in an `expect`, and one that can be is
# handled.
unwrap_used = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = "0.38.4"

[profile.release]
lto = true
codegen-units = 1
strip = true

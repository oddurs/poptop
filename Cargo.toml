[package]
name = "poptop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A system monitor you can rewind"
readme = "README.md"
# The website is its own crate with its own lockfile, and has no business in a
# `cargo publish` of the tool. See `web/README.md`.
exclude = ["web", "cairn", "docs", "check", ".githooks"]

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
# Text is measured in terminal columns, not scalar values. Already here through
# ratatui, which uses it for the same reason; declared directly because this
# crate calls it directly.
unicode-width = "0.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = "0.38.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
